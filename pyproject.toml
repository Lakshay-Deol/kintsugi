[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kintsugi"
version = "0.1.0"
description = "Manual-grounded repair assistant for repair technicians and Repair Cafe volunteers."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["appliance-repair", "rag", "mongodb", "gemma", "hybrid-search"]

dependencies = [
    # API
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    # MongoDB Atlas
    "pymongo>=4.9,<5",
    # Embeddings — Option A: fastembed ONNX (bge-small-en-v1.5)
    "fastembed>=0.4,<1",
    # LLM adapter — OpenAI-compatible (Gemma via AI Studio)
    "openai>=1.40,<3",
    # PDF parsing
    "pypdf>=6.0,<7",
    "pdfplumber>=0.11,<0.12",
    # Utilities
    "python-dotenv>=1.0,<2",
    "pydantic>=2.0,<3",
    "httpx>=0.27,<1",
    # Rate limiting
    "slowapi>=0.1.9,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
kintsugi-ingest = "kintsugi.ingest.cli:main"
kintsugi-api = "kintsugi.api.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/kintsugi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501", "SIM102", "SIM117"]
